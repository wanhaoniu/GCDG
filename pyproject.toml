[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcdg"
version = "1.0.0"
description = "Grasp-conditioned dependency graphs for minimal-intervention target retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6", "Pillow>=10", "scikit-learn>=1.3", "torch>=2.1"]
license = "MIT"

[project.optional-dependencies]
simulation = ["mujoco==3.2.6", "scipy", "trimesh", "coacd==1.0.10", "open3d==0.19.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
